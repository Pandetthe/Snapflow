name: Deploy to Dev Server

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (latest, or a release tag like v2026.5.3)"
        required: true
        default: "latest"
        type: string

concurrency:
  group: deploy-dev-server
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy ${{ inputs.image_tag }}
    runs-on: ubuntu-latest
    environment: Development
    steps:
      - name: Create GitHub Deployment
        id: create_deploy
        uses: actions/github-script@v7
        with:
          script: |
            const res = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: "Development",
              auto_merge: false,
              required_contexts: [],
              description: `Deploy ${{ inputs.image_tag }} to the dev server`
            });
            core.setOutput("deployment_id", String(res.data.id));

      - name: Mark Deployment In Progress
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number("${{ steps.create_deploy.outputs.deployment_id }}"),
              state: "in_progress",
              description: "Deploying to the dev server..."
            });

      - name: Install cloudflared
        run: |
          curl -fsSL -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Configure SSH over Cloudflare Access
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOSTNAME: ${{ vars.DEPLOY_SSH_HOSTNAME }}
          SSH_USER: ${{ vars.DEPLOY_SSH_USER }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          cat > ~/.ssh/config <<CFG
          Host snapflow-dev
              HostName $SSH_HOSTNAME
              User $SSH_USER
              IdentityFile ~/.ssh/id_deploy
              IdentitiesOnly yes
              StrictHostKeyChecking accept-new
              ProxyCommand cloudflared access ssh --hostname %h
          CFG
          chmod 600 ~/.ssh/config

      - name: Run deploy
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          ssh snapflow-dev "/opt/snapflow/deploy.sh '${{ inputs.image_tag }}'"

      - name: Smoke test
        env:
          PUBLIC_URL: ${{ vars.DEV_PUBLIC_URL }}
        run: |
          for i in $(seq 1 10); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$PUBLIC_URL/" || true)
            echo "attempt $i -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "dev site did not return 200" >&2
          exit 1

      - name: Mark Deployment Success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number("${{ steps.create_deploy.outputs.deployment_id }}"),
              state: "success",
              environment_url: "${{ vars.DEV_PUBLIC_URL }}",
              description: "Deployed successfully."
            });

      - name: Mark Deployment Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: Number("${{ steps.create_deploy.outputs.deployment_id }}"),
              state: "failure",
              description: "Deployment failed."
            });
